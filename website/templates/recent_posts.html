<div class="grid grid-cols-1 gap-6 md:grid-cols-3">
    {% for post in posts %}
    <article class="flex flex-col justify-between rounded-2xl border border-slate-200 bg-white p-6 transition hover:border-slate-300 dark:border-slate-800 dark:bg-slate-800/60 dark:hover:border-slate-700">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                <time datetime="{{ post.date }}">{{ post._date.formatted }}</time>
                {% if post.type %}
                <span aria-hidden="true">&middot;</span>
                <span class="font-medium text-sky-600 dark:text-sky-400">{{ post.type }}</span>
                {% endif %}
            </div>
            <h3 class="mt-3 font-display text-lg font-semibold text-slate-900 dark:text-white">
                <a href="/blog/{{ post.id }}" class="hover:text-sky-600 dark:hover:text-sky-400">{{ post.title }}</a>
            </h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-400">
                {{ post.excerpt }}
            </p>
        </div>
        <div class="mt-5">
            <a href="/blog/{{ post.id }}" class="inline-flex items-center gap-1 text-sm font-semibold text-sky-600 hover:text-sky-700 dark:text-sky-400 dark:hover:text-sky-300">
                Read article &rarr;
            </a>
        </div>
    </article>
    {% endfor %}
</div>
