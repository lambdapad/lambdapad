<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="generator" content="{{ lambdapad.name }} {{ lambdapad.vsn }}" />
  <link rel="shortcut icon" href="/favicons/favicon.ico">
  <link rel="apple-touch-icon" href="/favicons/apple-touch-icon-180x180.png" sizes="180x180">
  <link rel="icon" type="image/png" href="/favicons/favicon-16x16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="/favicons/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicons/android-36x36.png" sizes="36x36">
  <link rel="icon" type="image/png" href="/favicons/android-48x48.png" sizes="48x48">
  <link rel="icon" type="image/png" href="/favicons/android-72x72.png" sizes="72x72">
  <link rel="icon" type="image/png" href="/favicons/android-96x96.png" sizes="96x96">
  <link rel="icon" type="image/png" href="/favicons/android-144x144.png" sizes="144x144">
  <link rel="icon" type="image/png" href="/favicons/android-192x192.png" sizes="192x192">
  <title>{% if post.title %}{{ post.title }} - {{ blog.title }}{% elif page.title %}{{ page.title }} - {{ blog.title }}{% else %}{{ blog.title }}{% endif %}</title>
  <meta property="og:title" content="{% if post.title %}{{ post.title }}{% elif page.title %}{{ page.title }}{% else %}{{ blog.title }}{% endif %}" />
  <meta property="og:description" content="{% if post.excerpt %}{{ post.excerpt | escape }}{% else %}{{ blog.description }}{% endif %}" />
  <meta property="og:type" content="{% if post.title %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{% if post.id %}{{ site_url }}/blog/{{ post.id }}/{% else %}{{ blog.url }}{% endif %}" />
  <meta itemprop="name" content="{% if post.title %}{{ post.title }}{% else %}Lambdapad{% endif %}">
  <meta itemprop="description" content="{% if post.excerpt %}{{ post.excerpt | escape }}{% else %}{{ blog.description }}{% endif %}">
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% if post.title %}{{ post.title }} - {{ blog.title }}{% elif page.title %}{{ page.title }} - {{ blog.title }}{% else %}{{ blog.title }}{% endif %}" />
  <meta name="twitter:description" content="{% if post.excerpt %}{{ post.excerpt | escape }}{% else %}{{ blog.description }}{% endif %}" />
  {% if post.id %}
  <meta property="og:image" content="{{ site_url }}/images/og/{{ post.id }}.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ post.title }}" />
  <meta name="twitter:image" content="{{ site_url }}/images/x/{{ post.id }}.png" />
  <meta name="twitter:image:alt" content="{{ post.title }}" />
  {% else %}
  <meta property="og:image" content="{{ site_url }}/images/notepad.png" />
  <meta name="twitter:image" content="{{ site_url }}/images/notepad.png" />
  {% endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ blog.title }} Blog RSS" href="/blog/rss.xml" />
  <link href="/css/app.css" rel="stylesheet">
</head>
