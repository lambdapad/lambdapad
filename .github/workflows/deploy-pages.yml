# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy site

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the website with lpad
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
      with:
        elixir-version: '1.20.4'
        otp-version: '29.0.5'
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-prod-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-prod-
    - name: Install dependencies
      run: MIX_ENV=prod mix deps.get
    - name: Build the lpad escript
      run: MIX_ENV=prod mix escript.build
    - name: Generate the website
      run: ./lpad website/lambdapad.exs
    - name: Preserve the custom domain
      run: cp website/CNAME website/site/CNAME
    - name: Upload the generated site
      uses: actions/upload-pages-artifact@v3
      with:
        path: website/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
